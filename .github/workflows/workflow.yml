name: CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'source/**'
      - 'samples/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'msbuild/**'
      - 'nuget.config'
      - 'global.json'
  pull_request:
    branches:
      - master
    paths:
      - 'source/**'
      - 'samples/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'msbuild/**'
      - 'nuget.config'
      - 'global.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'merge = normal CI (default). probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - probe
        default: merge

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      # DELETE /actions/artifacts/{id} for keep-last-two Packages-* prune.
      # Release download still works with write.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      # Cross-repo repository_dispatch (timewarp-software rebuild) cannot use the
      # default GITHUB_TOKEN. A short-lived installation token is minted from the
      # org's TimeWarp Rebuild Dispatcher GitHub App (org variable REBUILD_APP_ID +
      # org secret REBUILD_APP_PRIVATE_KEY). If the app is not configured the step
      # is skipped and the dispatch degrades to a warning (site rebuilds nightly).
      - name: Mint rebuild dispatch token
        if: github.event_name == 'release' && vars.REBUILD_APP_ID != ''
        id: rebuild-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REBUILD_APP_ID }}
          private-key: ${{ secrets.REBUILD_APP_PRIVATE_KEY }}
          owner: TimeWarpEngineering
          repositories: timewarp-software

      - name: Run CI Pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'probe'
        env:
          GH_TOKEN: ${{ steps.rebuild-token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            dotnet run tools/dev-cli/dev.cs -- workflow --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          else
            dotnet run tools/dev-cli/dev.cs -- workflow
          fi

      - name: Upload Artifacts
        # Green master only. Skip PRs, releases, probe, and failed runs so
        # Packages-* does not refill Actions artifact quota.
        if: >-
          success() &&
          github.ref == 'refs/heads/master' &&
          github.event_name != 'release' &&
          !(github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        uses: actions/upload-artifact@v4
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Keep last two Packages artifacts
        if: >-
          success() &&
          github.ref == 'refs/heads/master' &&
          github.event_name != 'release' &&
          !(github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          current="Packages-${{ github.run_number }}"
          rows="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("Packages-")) and (.expired | not)) | [.created_at, (.id|tostring), .name] | @tsv')"
          if [ -z "${rows}" ]; then
            echo "No Packages-* artifacts listed; skip prune."
            exit 0
          fi
          filtered="$(printf '%s\n' "${rows}" | awk -F '\t' 'NF >= 3')"
          if ! printf '%s\n' "${filtered}" | awk -F '\t' -v n="${current}" '$3 == n { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Just-uploaded ${current} is not listed yet; skip prune (next green master will keep-last-2)."
            exit 0
          fi
          extra="$(printf '%s\n' "${filtered}" | sort -r -k1,1 | tail -n +3)"
          if [ -z "${extra}" ]; then
            echo "At most two Packages-* artifacts; nothing to prune."
            exit 0
          fi
          while IFS=$'\t' read -r created_at id name; do
            [ -n "${id}" ] || continue
            echo "Deleting ${name} (id=${id}, created_at=${created_at})"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done <<< "${extra}"
